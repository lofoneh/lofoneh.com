site:
  name: Lofoneh
  site: 'https://lofoneh.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false # TODO: set when you claim the domain in Google Search Console

# Default SEO metadata
metadata:
  title:
    default: Jeffery Lofoneh Asamani
    template: '%s — Jeffery Lofoneh Asamani'
  description: 'Personal portfolio of Jeffery Lofoneh Asamani — backend engineer building reliable systems.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Lofoneh
    images:
      - url: '~/assets/images/default.png' # TODO: replace with a real OG image in phase 7
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@lofoneh'
    site: '@lofoneh'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/writing/%slug%' # Posts live at /writing/<slug>
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'writing' # Blog index lives at /writing
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'writing/category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'writing/tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # TODO: set when you have a GA4 property (or skip and use Vercel Analytics)

ui:
  theme: 'dark' # Dark-first. Toggle still available via Header.
